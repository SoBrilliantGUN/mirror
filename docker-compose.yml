# 本地一键起：client(3000) + server(3001) + postgres(5432)。
# 用法：docker compose up --build
# 密钥从根目录 .env 注入（.env 已 gitignore）。LangFuse 独立，见 infra/langfuse。
#
# 实时语音（WebRTC）已在 Docker 下跑通（2026-11 实机确认）：icePortRange + iceAdditionalHostAddresses
# + compose 发布 UDP 段这套方案，浏览器上行 RTP 直达容器、下行 TTS 出帧都正常。
services:
  postgres:
    image: pgvector/pgvector:pg16   # 带 vector 扩展（长期记忆向量检索）；pg_trgm 已内置
    environment:
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mirror
    ports:
      - "5432:5432"          # 暴露给宿主，本地 `npm start` 也能连
    volumes:
      - mirror_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的 localhost，指向 compose 内网的 postgres 服务
      DATABASE_URL: postgresql://mirror:${POSTGRES_PASSWORD}@postgres:5432/mirror
      # LangFuse 在独立 compose（infra/langfuse）里、暴露在宿主 3002；容器内经 host.docker.internal 回宿主。
      # 宿主上的离线评测脚本仍读 .env 的 localhost:3002，二者互不干扰。
      LANGFUSE_BASE_URL: http://host.docker.internal:3002
    extra_hosts:
      # Docker Desktop 自带 host.docker.internal；Linux/WSL2 原生 Docker 靠这行 host-gateway 解析
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
      # ICE 媒体 UDP 段，必须和 .env 的 ICE_PORT_RANGE 一致（Docker 下语音能否通的关键）
      - "${ICE_PORT_RANGE:-50000-50100}:${ICE_PORT_RANGE:-50000-50100}/udp"
    volumes:
      # 招呼语 TTS 磁盘缓存：重启复用，避免容器重建后重复烧 TTS 调用
      - mirror_greetings_cache:/app/apps/server/.greetings-cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mirror_postgres_data:
  mirror_greetings_cache:
